<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>CNP Validator</h1>
    <input type="text" id="cnpInput" placeholder="Enter CNP (13 digits)" maxlength="13" pattern="\d{13}">
    <button onclick="validate()">Validate CNP</button>
    <p id="result"></p>

    <script>
    function validateCNP(cnp) {
        // Check for exactly 13 digits
        if (!/^\d{13}$/.test(cnp)) return false;
        
        // Extract components
        const sexDigit = parseInt(cnp[0]);
        const year = parseInt(cnp[1] + cnp[2]);
        const month = parseInt(cnp[3] + cnp[4]);
        const day = parseInt(cnp[5] + cnp[6]);
        const county = parseInt(cnp[7] + cnp[8]);
        
        // Validate sex digit (1-9, but typically 1-6 for Romanians)
        if (sexDigit < 1 || sexDigit > 9) return false;
        
        // Determine full year based on sex digit
        let fullYear;
        if (sexDigit === 1 || sexDigit === 2) fullYear = 1900 + year;
        else if (sexDigit === 3 || sexDigit === 4) fullYear = 1800 + year;
        else if (sexDigit === 5 || sexDigit === 6) fullYear = 2000 + year;
        else if (sexDigit === 7 || sexDigit === 8) fullYear = 1900 + year; // Foreigners
        else if (sexDigit === 9) fullYear = 1900 + year; // Special cases
        else return false;
        
        // Validate month (01-12)
        if (month < 1 || month > 12) return false;
        
        // Validate day based on month and leap year
        const daysInMonth = [31, (fullYear % 4 === 0 && (fullYear % 100 !== 0 || fullYear % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        if (day < 1 || day > daysInMonth[month - 1]) return false;
        
        // Validate county (01-52, 99 for foreigners)
        if ((county < 1 || county > 52) && county !== 99) return false;
        
        // The fixed key set by the Romanian government
        const key = "279146358279";
        // Multiply each CNP digit by the key digit at the same position
        let sum = 0;
        for (let i = 0; i < 12; i++) {
            // parseInt converts char '8' to number 8
            sum += parseInt(cnp[i]) * parseInt(key[i]);
        }
        // Get remainder when dividing by 11
        let checkDigit = sum % 11;
        // Special case: if remainder is 10, check digit becomes 1
        if (checkDigit === 10) checkDigit = 1;
        // Compare with the 13th digit (position 12) -if equal, valid!
        return checkDigit === parseInt(cnp[12]);
    }
        
    function validate() {
        const cnp = document.getElementById('cnpInput').value;
        const result = document.getElementById('result');
        if (validateCNP(cnp)) {
            result.textContent = 'Valid CNP';
            result.style.color = 'green';
        } else {
            result.textContent = 'Invalid CNP';
            result.style.color = 'red';
        }
    }
    </script>
</body>
</html>
