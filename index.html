<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT26L - Grid Layout</title>
    <style>
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 60px auto auto 50px;
            gap: 10px;
            min-height: 100vh;
        }

        header {
            background: #0F172A;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 1.5rem;
        }

        main {
            background: #f9f9f9;
            padding: 1.5rem;
        }

        aside {
            background: #e2e8f0;
            padding: 1.5rem;
        }

        aside ul {
            list-style: none;
            padding: 0;
        }

        aside ul li {
            margin-bottom: 0.5rem;
        }

        footer {
            background: #0F172A;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            body {
                grid-template-columns: 2fr 1fr;
                grid-template-rows: 60px 1fr 50px;
            }

            header {
                grid-column: 1 / 3;
            }

            footer {
                grid-column: 1 / 3;
            }
            
        }
    </style>
</head>

<body>

    <header>
        <h1>MySite</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Welcome</h2>
        <p>This page uses CSS Grid for layout. The body is the grid container — no wrapper div needed.</p>
        <p>Main takes 2fr and the sidebar takes 1fr. Header and footer span both columns.</p>
    </main>

    <aside>
        <h3>Links</h3>
        <ul>
            <li><a href="flex.html">Flexbox Version</a></li>
            <li><a href="#">Documentation</a></li>
            <li><a href="#">Resources</a></li>
            <li><a href="#">Support</a></li>
        </ul>
    </aside>

    <footer>
        <p>&copy; 2026</p>
    </footer>

</body>

</html>
