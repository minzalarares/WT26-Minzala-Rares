<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT26L - Flexbox Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #0F172A;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            height: 60px;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 1.5rem;
        }

        .middle {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px 0;
        }

        main {
            flex: 2;
            background: #f9f9f9;
            padding: 1.5rem;
        }

        aside {
            flex: 1;
            background: #e2e8f0;
            padding: 1.5rem;
        }

        aside ul {
            list-style: none;
            padding: 0;
        }

        aside ul li {
            margin-bottom: 0.5rem;
        }

        footer {
            background: #0F172A;
            color: white;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>MySite</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Flexbox needs this extra wrapper -->
    <div class="middle">
        <main>
            <h2>Welcome</h2>
            <p>This page uses Flexbox for layout. The body flexes vertically, and a .middle wrapper flexes horizontally for main + sidebar.</p>
            <p>Main takes flex:2 (2/3) and the sidebar takes flex:1 (1/3).</p>
        </main>

        <aside>
            <h3>Links</h3>
            <ul>
                <li><a href="grid.html">Grid Version</a></li>
                <li><a href="#">Documentation</a></li>
                <li><a href="#">Resources</a></li>
                <li><a href="#">Support</a></li>
            </ul>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026</p>
    </footer>

</body>

</html>
