    <title>Document</title>
    <style>
        :root {
            --dark-color: #FF0000;
            --light-color: #FFA4A4;
        }

        #light1 {
            fill: var(--light-color);
        }

        #dark1 {
            fill: var(--dark-color);
        }

        #dark2 {
            fill: var(--dark-color);
        }

        #light1,
        #dark1,
        #dark2 {
            transition: all 1s ease;
        }

        svg:hover #dark1 {
            transform: translateX(20%);
        }

        svg:hover #dark2 {
            transform: translateX(40%);
            opacity: 0;
        }

        svg:hover #dark0 {
            transform: translateX(0);
        }
    </style>
</head>
