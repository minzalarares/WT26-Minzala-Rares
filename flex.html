<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
<style>
    .container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    header {
        background-color: lightblue;
        flex:  1 100%;
    }
    main {
        background-color: lightgreen;
        flex: 2 1 60%;
    }
    aside {
        background-color: lightcoral;
        flex: 1 1 30%;
    }
    footer {
        background-color: lightgray;
        flex: 1 1 100%;
    }
</style>
</head>
<body>

    <div class="container">
        <header>
            HEADER
        </header>
        <main>
            MAIN
        </main>
        <aside>
            SIDEBAR
        </aside>
        <footer>
            FOOTER
        </footer>
    </div>
</body>
</html>
